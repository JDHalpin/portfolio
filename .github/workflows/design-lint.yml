name: Design system checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tokens, hardcoded colors, and WCAG contrast
        run: node scripts/lint-design.js
